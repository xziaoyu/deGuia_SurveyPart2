<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		name
		<input id='user1' type='text'>
		age
		<input id='user2' type='text'>
		place of birth
		<input id='user3' type='text'>
		favorite food
		<input id='user4' type='text'>
		are you gay?
		<input id='user5' type='text'>
		hobby1
		<input id='user6' type='text'>
		hobby2
		<input id='user7' type='text'>
		hobby3
		<input id='user8' type='text'>
		Current school
		<input id='user9' type='text'>
		Useless skill
		<input id='user10' type='text'>

		<button type="button" onclick="clickButton( document.getElementById('user1').value ,document.getElementById('user2').value, 
		document.getElementById('user3').value, document.getElementById('user4').value, document.getElementById('user5').value, 
		document.getElementById('user6').value, document.getElementById('user7').value, document.getElementById('user8').value,
		document.getElementById('user9').value, document.getElementById('user10').value )">TESTINGI UG TUPLOK!</button>

		<script>

		



		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			const postData = {
				name:a,
				age:b,	
    			place_of_birth:c,
    			favorite_food:d,
    			are_you_gay:e,
    			hobby1:f,
    			hobby2:g,
    			hobby3:h,
    			Current_school:i,
    			Useless_skill:j

			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/surveynimo',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
