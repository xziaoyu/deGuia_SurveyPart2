<!doctype html>
<html>
<head>
  <title>Log in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Log in</h1>

    <form action="/login" method="post" data-next="/main">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="80" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" maxlength="128" required>

      <button type="submit">Log in</button>
      <a class="button" href="/register">Register</a>
    </form>

    <p role="status"></p>
  </main>

  <script>
    const form = document.querySelector("form");
    const statusMessage = document.querySelector("[role='status']");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submitButton = form.querySelector("button[type='submit']");
      statusMessage.textContent = "";
      submitButton.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });

        const result = await response.json();
        if (!response.ok) {
          statusMessage.textContent = typeof result.detail === "string"
            ? result.detail
            : "Check that all required fields are filled in correctly.";
          return;
        }

        window.location.assign(form.dataset.next);
      } catch {
        statusMessage.textContent = "Could not reach the server. Try again.";
      } finally {
        submitButton.disabled = false;
      }
    });

    if (window.location.search === "?registered=1") {
      statusMessage.textContent = "Account created. You can now log in.";
    }
  </script>
</body>
</html>
